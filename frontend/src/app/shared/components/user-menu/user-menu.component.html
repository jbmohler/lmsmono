<div class="relative">
  <button
    #trigger
    type="button"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
    [attr.aria-expanded]="open()"
    aria-haspopup="menu"
    [attr.aria-label]="'Account menu for ' + user()?.username"
    class="flex items-center gap-2 rounded-full py-0.5 pl-0.5 pr-2 text-slate-300 hover:text-white focus:outline-none focus:ring-2 focus:ring-slate-400"
  >
    <span
      class="flex h-8 w-8 items-center justify-center rounded-full bg-slate-600 text-sm font-medium text-white"
    >
      {{ initials() }}
    </span>
    <span class="hidden text-sm sm:inline">{{ user()?.username }}</span>
  </button>

  @if (open()) {
    <div
      role="menu"
      (keydown)="onMenuKeydown($event)"
      class="absolute right-0 z-50 mt-2 w-64 origin-top-right rounded-md border border-gray-200 bg-white py-1 shadow-lg focus:outline-none"
    >
      <div class="border-b border-gray-100 px-4 py-2">
        @if (user()?.fullName) {
          <div class="truncate text-sm font-medium text-gray-900">{{ user()?.fullName }}</div>
        }
        <div class="truncate text-xs text-gray-500">{{ user()?.username }}</div>
      </div>

      <button
        #menuItem
        type="button"
        role="menuitem"
        (click)="signOut()"
        class="block w-full px-4 py-2 text-left text-sm text-gray-700 hover:bg-gray-100 focus:bg-gray-100 focus:outline-none"
      >
        Sign out
      </button>

      <button
        #menuItem
        type="button"
        role="menuitem"
        (click)="signOutAll()"
        class="block w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-red-50 focus:bg-red-50 focus:outline-none"
      >
        Sign out all devices
      </button>
    </div>
  }
</div>
