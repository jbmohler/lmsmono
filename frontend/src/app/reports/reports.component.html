<div class="page-container">
  <div class="page-content">
    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <h1 class="text-2xl font-semibold text-gray-900">Reports</h1>
        <p class="text-sm text-gray-500">Financial reports and analysis</p>
      </div>

      <!-- Report categories -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        @for (report of reports; track report.id) {
          <a
            [routerLink]="['/reports', report.id]"
            class="card p-4 hover:border-blue-300 hover:shadow-md transition-all"
            [class.hidden]="report.desktopOnly"
            [class.md:block]="report.desktopOnly"
          >
            <!--
              The icon and title share a grid row, so the row is as tall as the
              icon and the two centre on each other with no hardcoded heights.
              The description sits in column 2 of the next row, indented under
              the title.
            -->
            <div class="grid grid-cols-[auto_1fr] items-center gap-x-3 gap-y-1">
              <div class="p-2 bg-blue-50 rounded-lg" [title]="groupLabel(report.group)">
                <img
                  [src]="'/assets/icons/' + report.group + '.svg'"
                  alt=""
                  class="w-6 h-6 block"
                />
              </div>
              <h2 class="text-lg font-medium text-gray-900">{{ report.name }}</h2>
              <p class="col-start-2 text-sm text-gray-500">{{ report.description }}</p>
            </div>
          </a>
        }
      </div>
    </div>
  </div>
</div>
